<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ff"><title>Our Days</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f8f5ff;color:#282337;margin:0;padding:env(safe-area-inset-top) 16px 40px}main{max-width:520px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:26px 0 14px}h1{margin:0;font-size:27px}small{color:#827b91}.panel{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 24px #3b24520d}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#eee7f9;color:#45355f}button.primary{background:#7553a4;color:white;width:100%;font-weight:700;margin-top:14px}button.minor{background:transparent;padding:8px}#calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayhead{text-align:center;color:#80778e;font-size:12px;padding:6px 0}.day{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;background:#f7f4fa;font-size:14px;font-weight:600}.empty{background:transparent}.controls{display:flex;gap:8px}.controls button{flex:1}.controls button.selected{background:#7553a4;color:white}label{display:block;font-size:14px;font-weight:650;margin:14px 0 7px}input[type=text]{width:100%;padding:15px;border:1px solid #e4ddec;border-radius:13px;font-size:18px;outline-color:#7553a4}input[type=color]{height:45px;width:65px;border:0;background:transparent;vertical-align:middle}.hint{font-size:12px;color:#80778e;margin-top:8px;line-height:1.6}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}#status{font-size:13px;color:#7652a5;min-height:20px;margin-top:10px}.day:not(.empty){cursor:pointer}.eventmark{box-shadow:inset 0 -4px 0 #7553a4}.modal{position:fixed;inset:0;background:#20182b88;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.modal.open{display:flex}.dialog{background:white;border-radius:22px;padding:22px;width:min(100%,440px);max-height:85vh;overflow:auto}.dialog h2{margin:0 0 10px}.dialog textarea{width:100%;border:1px solid #ddd5e8;border-radius:12px;padding:12px;font:inherit;min-height:80px}.dialog input{width:100%;padding:12px;border:1px solid #ddd5e8;border-radius:12px;font:inherit}.eventrow{padding:10px 0;border-bottom:1px solid #eee}.eventrow button{float:right;padding:5px 9px;font-size:12px}.foot{font-size:12px;color:#80778e;line-height:1.6}</style></head><body><main><header><div><h1>Our Days ♡</h1><small>把休假變得簡單</small></div><span>🗓️</span></header><section class="panel"><div class="month"><button id="prev" aria-label="上個月">‹</button><strong id="monthTitle"></strong><button id="next" aria-label="下個月">›</button></div><div id="calendar"></div><div class="legend" id="legend"></div></section><section class="panel"><div class="controls"><button id="me" class="selected">我的休假</button><button id="other">阿崴休假</button></div><label for="dates">輸入日期</label><input id="dates" type="text" inputmode="text" placeholder="例如 1.3.13.17 或 5-10"><div class="hint">可用句點、逗號、空格分隔，也支援 5-10 這樣的連續日期。</div><label for="color">休假顏色 <input type="color" id="color" value="#e6b4da"></label><button class="primary" id="apply">一鍵標記休假</button><button class="minor" id="remove">移除輸入日期的標記</button><div id="status" role="status"></div></section><div class="modal" id="modal"><div class="dialog"><h2 id="eventTitle">日期事件</h2><div id="eventList"></div><label for="eventName">事件名稱</label><input id="eventName" placeholder="例如：泡溫泉"><label for="eventTime">時間（可留空）</label><input id="eventTime" type="time"><label for="eventNote">備註（可留空）</label><textarea id="eventNote" placeholder="輸入備註"></textarea><button id="saveEvent" class="primary">儲存事件</button><button id="closeEvent" class="minor">關閉</button></div></div><p class="foot">目前是單機試用版，資料只保存在這台裝置的瀏覽器。兩人即時共享及原生主畫面 Widget 尚未啟用。請勿清除網站資料，以免遺失標記。</p></main><script>const key='ourdays-local-v1';let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let now=new Date(),year=now.getFullYear(),month=now.getMonth(),who='me',activeDay=null;const $=x=>document.getElementById(x);const names=['日','一','二','三','四','五','六'];function monthKey(){return `${year}-${String(month+1).padStart(2,'0')}`}function save(){localStorage.setItem(key,JSON.stringify(data))}function hexRgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}function mix(a,b){let A=hexRgb(a),B=hexRgb(b);return '#'+A.map((v,i)=>Math.round((v+B[i])/2).toString(16).padStart(2,'0')).join('')}function textColor(h){let c=hexRgb(h);return (c[0]*.299+c[1]*.587+c[2]*.114)<145?'#fff':'#242032'}function render(){let days=new Date(year,month+1,0).getDate(),start=new Date(year,month,1).getDay(),monthData=data[monthKey()]||{};$('monthTitle').textContent=`${year} 年 ${month+1} 月`;$('calendar').innerHTML='';names.forEach(n=>{let e=document.createElement('div');e.className='dayhead';e.textContent=n;$('calendar').append(e)});for(let i=0;i<start;i++){let e=document.createElement('div');e.className='day empty';$('calendar').append(e)}for(let d=1;d<=days;d++){let e=document.createElement('div'),rec=monthData[d]||{},c=rec.me&&rec.other?mix(rec.me,rec.other):rec.me||rec.other;e.className='day';e.textContent=d;if(c){e.style.background=c;e.style.color=textColor(c)}e.title=rec.me&&rec.other?'共同休假':rec.me?'我的休假':rec.other?'阿崴休假':'';if((data.events?.[monthKey()]?.[d]||[]).length)e.classList.add('eventmark');e.addEventListener('click',()=>openEvent(d));$('calendar').append(e)}$('legend').innerHTML=`<span><i class="dot" style="background:${data.colors?.me||'#e6b4da'}"></i>我</span><span><i class="dot" style="background:${data.colors?.other||'#91c8ed'}"></i>阿崴</span><span>重疊日期自動混色</span>`}function parseDates(s){let max=new Date(year,month+1,0).getDate(),out=new Set(),invalid=[];for(let part of s.trim().split(/[.,，、\s;；]+/).filter(Boolean)){let match=part.match(/^(\d{1,2})-(\d{1,2})$/);if(match){let a=+match[1],b=+match[2];if(a<1||b>max||a>b){invalid.push(part);continue}for(let i=a;i<=b;i++)out.add(i)}else if(/^\d{1,2}$/.test(part)&&+part>=1&&+part<=max)out.add(+part);else invalid.push(part)}return {days:[...out],invalid}}function act(remove){let {days,invalid}=parseDates($('dates').value);if(invalid.length){$('status').textContent='日期格式有誤：'+invalid.join('、');return}if(!days.length){$('status').textContent='請先輸入日期';return}let k=monthKey();data[k] ||= {};for(let d of days){data[k][d] ||= {};if(remove)delete data[k][d][who];else data[k][d][who]=$('color').value;if(!Object.keys(data[k][d]).length)delete data[k][d]}save();render();$('status').textContent=`已${remove?'移除':'標記'} ${days.length} 天：${days.join('、')} 號`}$('apply').onclick=()=>act(false);$('remove').onclick=()=>act(true);$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};function select(w){who=w;$('me').classList.toggle('selected',w==='me');$('other').classList.toggle('selected',w==='other');$('color').value=data.colors?.[w]||(w==='me'?'#e6b4da':'#91c8ed');$('status').textContent=''}$('me').onclick=()=>select('me');$('other').onclick=()=>select('other');$('color').onchange=()=>{data.colors ||= {};data.colors[who]=$('color').value;save();render()};function openEvent(d){activeDay=d;$('eventTitle').textContent=`${year} 年 ${month+1} 月 ${d} 日`;$('eventName').value='';$('eventTime').value='';$('eventNote').value='';showEvents();$('modal').classList.add('open')}function showEvents(){let arr=data.events?.[monthKey()]?.[activeDay]||[];$('eventList').innerHTML='';arr.forEach((ev,i)=>{let row=document.createElement('div');row.className='eventrow';let b=document.createElement('button');b.textContent='刪除';b.onclick=()=>{data.events[monthKey()][activeDay].splice(i,1);save();showEvents();render()};let content=document.createElement('div');content.textContent=(ev.time?ev.time+' · ':'')+ev.name;let note=document.createElement('small');note.textContent=ev.note||'';row.append(b,content,note);$('eventList').append(row)})}$('saveEvent').onclick=()=>{let name=$('eventName').value.trim();if(!name){alert('請輸入事件名稱');return}data.events||={};data.events[monthKey()]||={};data.events[monthKey()][activeDay]||=[];data.events[monthKey()][activeDay].push({name,time:$('eventTime').value,note:$('eventNote').value});save();showEvents();render();$('eventName').value='';$('eventTime').value='';$('eventNote').value=''};$('closeEvent').onclick=()=>$('modal').classList.remove('open');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});render();</script></body></html>
